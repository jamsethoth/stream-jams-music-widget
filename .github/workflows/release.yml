name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, without the leading v"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release tag does not already exist
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ inputs.version }} already exists."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- browser
      - run: npm run validate
      - name: Package runtime artifact
        run: npm run package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "v${{ inputs.version }}" --message "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
      - name: Create GitHub release
        run: >
          gh release create "v${{ inputs.version }}"
          "dist/stream-jams-music-widget-v${{ inputs.version }}.zip#Runtime package"
          --title "Stream Jams Music Widget v${{ inputs.version }}"
          --generate-notes
          ${{ inputs.prerelease && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
